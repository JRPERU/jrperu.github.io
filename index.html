  <style>
    :root {
      --bethel-blue: #0056b3;
      --bethel-dark: #003d82;
      --yape-purple: #742284;
      --foreign-green: #28a745;
      --whatsapp-green: #25D366;
      --bg-color: #f4f6f9;
      --text-gray: #555;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-color);
      margin: 0;
      padding: 0;
      color: #333;
      padding-bottom: 80px;
    }

    /* --- HEADER --- */
    header {
      background: linear-gradient(135deg, var(--bethel-blue), var(--bethel-dark));
      color: white;
      text-align: center;
      padding: 60px 20px 90px;
      clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
    }

    header h1 { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; margin: 0 0 10px 0; }
    header p { opacity: 0.9; font-size: 1.1rem; margin: 0; }

    /* --- CONTENEDOR PRINCIPAL --- */
    .container {
      max-width: 1000px;
      margin: -50px auto 40px;
      padding: 0 20px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* --- TARJETAS --- */
    .cards-flex {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-top: 6px solid var(--bethel-blue);
    }

    .card:hover { transform: translateY(-5px); }
    .card.yape { border-top-color: var(--yape-purple); }
    .card.foreign { border-top-color: var(--foreign-green); }

    .card h3 { 
      font-family: 'Montserrat', sans-serif; 
      margin-bottom: 15px; 
      font-size: 1.25rem;
      color: #333;
    }
    
    .card.yape h3 { color: var(--yape-purple); }
    .card.foreign h3 { color: var(--foreign-green); }

    .card p { font-size: 0.9rem; color: var(--text-gray); margin: 5px 0; }

    /* --- NÚMEROS Y BOTÓN DE COPIAR --- */
    .number-box {
      background: #f8f9fa;
      padding: 8px 15px;
      border-radius: 8px;
      margin: 5px 0 15px 0; /* Ajuste de márgenes */
      width: 90%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #eee;
    }

    .number-text {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.95rem; /* Un pelín más pequeño para que entren bien */
      color: #222;
      white-space: nowrap; 
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .label-small {
      font-size: 0.8rem;
      color: #888;
      align-self: flex-start;
      margin-left: 15px;
      margin-bottom: 2px;
    }

    .btn-copy {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--bethel-blue);
      font-size: 0.8rem;
      font-weight: bold;
      margin-left: 8px;
      padding: 5px 10px;
      background: rgba(0, 86, 179, 0.1);
      border-radius: 5px;
      transition: 0.2s;
    }

    .btn-copy:hover { background: rgba(0, 86, 179, 0.2); }

    /* --- IMAGEN QR --- */
    .qr-img {
      width: 150px;
      height: 150px;
      margin: 10px 0 20px 0;
      border: 1px solid #eee;
      border-radius: 12px;
      object-fit: cover;
      background: #fafafa;
    }

    /* --- BOTONES DE ACCIÓN --- */
    .btn-action {
      display: inline-block;
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 0.9rem;
      transition: 0.3s;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .btn-yape { background: var(--yape-purple); color: white; }
    .btn-yape:hover { background: #5a1a66; }
    .btn-email { background: #e8f5e9; color: var(--foreign-green); }
    .btn-email:hover { background: #c8e6c9; }

    /* --- HISTORIA --- */
    .story-section {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      margin-top: 60px;
      text-align: left;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
      border-left: 5px solid var(--bethel-blue);
    }
    .story-section h2 { color: var(--bethel-blue); font-family: 'Montserrat', sans-serif; }
    .story-section p { color: #555; line-height: 1.8; }

      background-color:
